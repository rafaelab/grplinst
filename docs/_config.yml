title: grplinst
description: >-
    Plasma-instability energy losses for electromagnetic cascades in CRPropa.
author: Rafael Alves Batista

url: https://rafaelab.github.io
baseurl: /grplinst
theme: minima
# highlight_theme: tomorrow-night-eighties
# text_skin: orange
markdown: kramdown


# navigation bar at the top;
# the home page (index.md) is intentionally omitted due to the theme chosen
header_pages:
    - getting-started.md
    - physics.md
    - models.md
    - usage.md
    - api-reference.md
    - references.md

# do not treat the repository's build artefacts or top-level files as content.
exclude:
    - build/
    - Gemfile
    - Gemfile.lock
